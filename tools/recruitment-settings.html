<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Craft | 募集設定</title><style>body{font-family:system-ui,"Yu Gothic",sans-serif;max-width:780px;margin:0 auto;background:#f7f4ff;color:#2b284e;padding:22px}main{background:#fff;padding:26px;border:1px solid #ddd6f5;border-radius:23px;box-shadow:0 12px 35px #4c3f8915}label{display:grid;gap:8px;margin:16px 0;font-weight:750}input,select,button{font:inherit;border:1px solid #dcd5f4;border-radius:12px;padding:12px}input{width:100%;box-sizing:border-box}button{background:#6753e9;color:white;border:0;cursor:pointer;font-weight:800}.note{background:#fff6e8;padding:15px;border-radius:12px;color:#694b25;line-height:1.7}p{line-height:1.8}small{color:#79708d}</style></head><body><main><h1>Live Craft 募集設定</h1><p>募集状況とフォームのURLを設定し、<code>assets/config.js</code>を書き出します。サイトへ自動保存されません。</p><div class="note">時刻指定はブラウザー上の表示判定です。未公開募集情報の秘密保持や正確な時刻の保証には利用できません。Googleフォーム等で受付期間を別途設定してください。</div><label>募集方法<select id="mode"><option value="manual">手動（下のチェックを使用）</option><option value="paused">募集停止中</option><option value="scheduled">日時指定</option></select></label><label><input id="open" type="checkbox" style="width:auto"> 手動モード：募集受付中にする</label><label>応募フォームURL（https://）<input id="app" type="url" placeholder="https://..."></label><label>問い合わせフォームURL（https://）<input id="contact" type="url" placeholder="https://..."></label><label>募集開始日時（例：2026-11-01T10:00:00+09:00）<input id="start" type="text" placeholder="2026-11-01T10:00:00+09:00"></label><label>募集終了日時（例：2026-11-30T23:59:59+09:00）<input id="end" type="text" placeholder="2026-11-30T23:59:59+09:00"></label><label>規約の施行日<input id="date" type="text" placeholder="2026年11月1日"></label><label>規約バージョン<input id="ver" type="text" placeholder="1.0"></label><p id="message" role="status"></p><button id="save" type="button">config.jsをダウンロード</button><p><small>今の設定は既存のconfig.jsから読み込みます。ダウンロードしたファイルをassets/config.jsに上書きし、GitHubにコミットしてください。</small></p></main><script src="../assets/config.js"></script><script>(()=>{'use strict';const c=window.LIVE_CRAFT_CONFIG||{};const el=id=>document.getElementById(id);el('mode').value=c.recruitmentMode||'manual';el('open').checked=!!c.recruitmentOpen;el('app').value=c.applicationUrl||'';el('contact').value=c.contactUrl||'';el('start').value=c.recruitmentStartAt||'';el('end').value=c.recruitmentEndAt||'';el('date').value=c.rulesEffectiveDate||'';el('ver').value=c.rulesVersion||'1.0';el('save').onclick=()=>{const app=el('app').value.trim(),contact=el('contact').value.trim(),start=el('start').value.trim(),end=el('end').value.trim();try{for(const url of [app,contact])if(url&&new URL(url).protocol!=='https:')throw Error('外部URLはhttps://にしてください。');for(const d of [start,end])if(d&&!Number.isFinite(Date.parse(d)))throw Error('日時をISO8601形式で指定してください。');if(start&&end&&Date.parse(end)<=Date.parse(start))throw Error('終了日時は開始日時より後にしてください。');const obj={recruitmentOpen:el('open').checked,recruitmentMode:el('mode').value,recruitmentStartAt:start,recruitmentEndAt:end,applicationUrl:app,contactUrl:contact,rulesEffectiveDate:el('date').value.trim()||'未定',rulesVersion:el('ver').value.trim()||'1.0'};const js='/* Live Craft 公開用設定。個人情報や非公開URLを入れないでください。 */\nwindow.LIVE_CRAFT_CONFIG = '+JSON.stringify(obj,null,2)+';\n';const blob=new Blob([js],{type:'text/javascript'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='config.js';a.click();URL.revokeObjectURL(url);el('message').textContent='書き出しました。assets/config.js を更新してください。';}catch(e){el('message').textContent=e.message;}};})();</script></body></html>
