name: "Live Craft | 動画管理"
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: "公開前確認のみ（ON=プレビュー、OFF=公開・保存）"
        required: true
        type: boolean
        default: true
      operation:
        description: "操作"
        required: true
        type: choice
        options:
          - "upsert"
          - "hide"
          - "delete"
        default: "upsert"
      id:
        description: "固定ID（英小文字・数字・ハイフン）"
        required: false
        type: string
      title:
        description: "動画タイトル"
        required: false
        type: string
      member:
        description: "配信者名"
        required: false
        type: string
      platform:
        description: "媒体"
        required: false
        type: string
      category:
        description: "動画カテゴリー"
        required: false
        type: string
      date:
        description: "公開日 YYYY-MM-DD"
        required: false
        type: string
      url:
        description: "動画URL（https://）"
        required: false
        type: string
      thumbnail:
        description: "画像パス: assets/videos/..."
        required: false
        type: string
      description:
        description: "紹介文"
        required: false
        type: string
      featured:
        description: "おすすめ動画"
        required: true
        type: choice
        options:
          - "keep"
          - "true"
          - "false"
        default: "keep"
      publishAt:
        description: "画面表示の開始日時（任意）"
        required: false
        type: string
      published:
        description: "公開状態（keep は既存値を維持 / 新規時は非公開）"
        required: true
        type: choice
        options:
          - "keep"
          - "true"
          - "false"
        default: "keep"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update_and_publish:
    uses: ./.github/workflows/_manage-and-publish.yml
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      resource: videos
      form: ${{ toJSON(inputs) }}
      preview_only: ${{ inputs.preview_only }}
