name: "Live Craft | イベント管理"
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "操作"
        required: true
        type: choice
        options:
          - "upsert"
          - "hide"
          - "delete"
        default: "upsert"
      id:
        description: "固定ID（英小文字・数字・ハイフン）"
        required: false
        type: string
      title:
        description: "イベント名"
        required: false
        type: string
      date:
        description: "日付 YYYY-MM-DD"
        required: false
        type: string
      time:
        description: "時間 HH:MM"
        required: false
        type: string
      type:
        description: "イベント種別"
        required: false
        type: string
      description:
        description: "説明"
        required: false
        type: string
      url:
        description: "案内URL（https://）"
        required: false
        type: string
      thumbnail:
        description: "画像パス: assets/events/..."
        required: false
        type: string
      publishAt:
        description: "画面表示の開始日時（任意）"
        required: false
        type: string
      published:
        description: "公開状態（keep は既存値を維持 / 新規時は非公開）"
        required: true
        type: choice
        options:
          - "keep"
          - "true"
          - "false"
        default: "keep"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update_and_publish:
    uses: ./.github/workflows/_manage-and-publish.yml
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      resource: events
      form: ${{ toJSON(inputs) }}
