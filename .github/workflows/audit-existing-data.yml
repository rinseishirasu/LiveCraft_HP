name: "Live Craft | 既存データ確認・ID補完"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "確認だけ／旧データのID未設定箇所を補完"
        required: true
        type: choice
        options:
          - inspect
          - migrate
        default: inspect
      resource:
        description: "確認・補完するデータの種類"
        required: true
        type: choice
        options:
          - all
          - members
          - streams
          - news
          - videos
          - events
          - collabs
          - recruitment
        default: all
      query:
        description: "既存データを検索（inspectのみ／名前・ID・事務所など）"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: livecraft-publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  inspect:
    if: ${{ inputs.mode == 'inspect' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find existing record IDs
        env:
          MODE: inspect
          RESOURCE: ${{ inputs.resource }}
          QUERY: ${{ inputs.query }}
          REPORT_JSON: ${{ runner.temp }}/livecraft-existing-data.json
        run: node scripts/legacy_inventory.cjs
      - name: Downloadable inventory (public-site data only)
        uses: actions/upload-artifact@v4
        with:
          name: livecraft-existing-data
          path: ${{ runner.temp }}/livecraft-existing-data.json
          retention-days: 7
  migrate_build:
    if: ${{ inputs.mode == 'migrate' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add missing IDs without changing existing fields
        env:
          MODE: migrate
          RESOURCE: ${{ inputs.resource }}
          QUERY: ${{ inputs.query }}
        run: node scripts/legacy_inventory.cjs
      - name: Run regression tests
        run: |
          node tests/legacy-inventory.test.cjs
          node tests/manage-content.test.cjs
          node tests/streams.test.cjs
          node tests/schedule-page.test.cjs
          node tests/member-icon.test.cjs
          node tests/platforms.test.cjs
      - name: Commit only existing public-data sources
        run: |
          git add -- assets/members.js assets/streams.js assets/news.js assets/videos.js assets/events.js assets/collabs.js
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'chore(content): assign missing legacy record IDs'
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          else
            echo 'No legacy changes are needed.'
          fi
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_site.py --output _site
      - name: Upload Pages build
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: ${{ inputs.mode == 'migrate' }}
    needs: migrate_build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
