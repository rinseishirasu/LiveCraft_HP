name: Live Craft | GitHub-only management and publish
on:
  workflow_call:
    inputs:
      resource:
        required: true
        type: string
      form:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: livecraft-publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  update_build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Update the selected content data
        id: change
        env:
          FORM_JSON: ${{ inputs.form }}
          RESOURCE: ${{ inputs.resource }}
        run: node scripts/manage_content.cjs
      - name: Test before saving
        run: |
          node tests/legacy-inventory.test.cjs
          node tests/manage-content.test.cjs
          node tests/streams.test.cjs
          node tests/schedule-page.test.cjs
          node tests/member-icon.test.cjs
          node tests/platforms.test.cjs
      - name: Commit validated change
        env:
          TARGET_FILE: ${{ steps.change.outputs.target }}
        run: |
          git add -- "$TARGET_FILE"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "chore(content): update ${{ inputs.resource }} via Actions"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          else
            echo 'No data changes; continuing with publish.'
          fi
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and optimize site from updated worktree
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_site.py --output _site
      - name: Upload Pages build
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Failure guidance (see failed step above)
        if: ${{ failure() }}
        run: |
          {
            echo '## Live Craft: 実行に失敗しました'
            echo '赤い × が付いたステップを展開し、exit code 1 より上の最初の ERROR / Error を確認してください。'
            echo '- Update / tests: 入力値、対象ID、日時、データ形式を確認'
            echo '- Commit validated change: Actions の Contents 書込権限、ブランチ保護・ruleset を確認'
            echo '- Build / Upload Pages: Python/Pillow のエラーと Pages 設定を確認'
            echo '詳細: リポジトリの ACTIONS_ERROR_GUIDE.md'
          } >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: update_build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Failure guidance for deployment
        if: ${{ failure() }}
        run: |
          {
            echo '## GitHub Pages 公開に失敗しました'
            echo '赤い × の Deploy ステップを確認してください。'
            echo 'Settings → Pages → Source = GitHub Actions、environment の承認条件、Pages / id-token 権限を確認してください。'
            echo '詳細: ACTIONS_ERROR_GUIDE.md'
          } >> "$GITHUB_STEP_SUMMARY"
