name: Live Craft | GitHub-only management and publish
on:
  workflow_call:
    inputs:
      resource:
        required: true
        type: string
      form:
        required: true
        type: string
      preview_only:
        required: false
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: livecraft-publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  update_build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify required repository files before execution
        shell: bash
        run: |
          required=(
            scripts/manage_content.cjs
            scripts/legacy_inventory.cjs
            scripts/build_site.py
            tests/_fixtures.cjs
            tests/data-format.test.cjs
            tests/legacy-inventory.test.cjs
            tests/manage-content.test.cjs
            tests/streams.test.cjs
            tests/schedule-page.test.cjs
            tests/member-icon.test.cjs
            tests/platforms.test.cjs
            tests/v6-features.test.cjs
            tests/v61.test.cjs
            tests/v62.test.cjs
            tests/v621.test.cjs
            tests/v63.test.cjs
            tests/v7.test.cjs
            scripts/content_audit.cjs
            scripts/asset_audit.py
            scripts/change_report.cjs
          )
          missing=0
          for item in "${required[@]}"; do
            if [[ ! -f "$item" ]]; then
              echo "::error file=$item::Missing $item. Copy the full tests/ directory from the Ver.6.3 release package to the repository root. If a script is missing, obtain it from the Ver.6.3 release package."
              echo "MISSING: $item"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            {
              echo '## Live Craft: 管理・テスト用ファイルが不足しています'
              echo 'エラーで表示されたパスに、Ver.6.3 正式版のファイルをアップロードしてください。'
              echo '保存先はリポジトリ直下の `tests/` と `scripts/` です。'
              echo 'アップロード後、コミットしてから Actions を新規実行してください。'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'PASS: All required Live Craft scripts and tests are present.'
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Update the selected content data
        id: change
        env:
          FORM_JSON: ${{ inputs.form }}
          RESOURCE: ${{ inputs.resource }}
        run: node scripts/manage_content.cjs
      - name: Test before saving
        run: |
          node tests/legacy-inventory.test.cjs
          node tests/manage-content.test.cjs
          node tests/data-format.test.cjs
          node tests/streams.test.cjs
          node tests/schedule-page.test.cjs
          node tests/member-icon.test.cjs
          node tests/platforms.test.cjs
          node tests/v6-features.test.cjs
          node tests/v61.test.cjs
          node tests/v62.test.cjs
          node tests/v621.test.cjs
          node tests/v63.test.cjs
          node tests/v7.test.cjs
      - name: Validate cross-file references and published data
        run: node scripts/content_audit.cjs --strict --output review/site-audit.md
      - name: Review change before publishing
        env:
          TARGET_FILE: ${{ steps.change.outputs.target }}
          RESOURCE: ${{ inputs.resource }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
        run: node scripts/change_report.cjs
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Audit images including member subfolders (read-only)
        run: python scripts/asset_audit.py --output review/image-audit.md
      - name: Configure Pages (publish only)
        if: ${{ !inputs.preview_only }}
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site from the validated working tree
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_site.py --output _site
      - name: Downloadable preview (no commit or public deployment)
        if: ${{ inputs.preview_only }}
        uses: actions/upload-artifact@v4
        with:
          name: livecraft-preview-${{ inputs.resource }}
          path: _site
          retention-days: 7
          if-no-files-found: error
      - name: Upload review and image reports
        uses: actions/upload-artifact@v4
        with:
          name: livecraft-review-${{ inputs.resource }}
          path: review/
          retention-days: 7
          if-no-files-found: error
      - name: "Preview completed: no commit or deployment"
        if: ${{ inputs.preview_only }}
        run: |
          echo '## ✅ 公開前プレビューが完成しました' >> "$GITHUB_STEP_SUMMARY"
          echo '変更は GitHub に保存されず、サイトも公開されていません。Actions の Artifacts から preview と review をダウンロードして確認できます。' >> "$GITHUB_STEP_SUMMARY"
          echo '承認後は同じ管理フォームで「公開前確認のみ」を OFF にして新規実行してください。' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit validated change (publish only)
        if: ${{ !inputs.preview_only }}
        env:
          TARGET_FILE: ${{ steps.change.outputs.target }}
        run: |
          git add -- "$TARGET_FILE"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "chore(content): update ${{ inputs.resource }} via Actions"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          else
            echo 'No data changes; continuing with publish.'
          fi
      - name: Upload Pages build (publish only)
        if: ${{ !inputs.preview_only }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Failure guidance (see failed step above)
        if: ${{ failure() }}
        run: |
          {
            echo '## Live Craft: 実行に失敗しました'
            echo '赤い × が付いたステップを展開し、exit code 1 より上の最初の ERROR / Error を確認してください。'
            echo '- Update / tests: 入力値、対象ID、日時、データ形式を確認'
            echo '- Commit validated change: Actions の Contents 書込権限、ブランチ保護・ruleset を確認'
            echo '- Build / Upload Pages: Python/Pillow のエラーと Pages 設定を確認'
            echo '詳細: リポジトリの ACTIONS_ERROR_GUIDE.md'
          } >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: ${{ !inputs.preview_only }}
    needs: update_build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Failure guidance for deployment
        if: ${{ failure() }}
        run: |
          {
            echo '## GitHub Pages 公開に失敗しました'
            echo '赤い × の Deploy ステップを確認してください。'
            echo 'Settings → Pages → Source = GitHub Actions、environment の承認条件、Pages / id-token 権限を確認してください。'
            echo '詳細: ACTIONS_ERROR_GUIDE.md'
          } >> "$GITHUB_STEP_SUMMARY"
