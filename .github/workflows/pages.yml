name: Live Craft GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: livecraft-publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify required repository files before execution
        shell: bash
        run: |
          required=(
            scripts/manage_content.cjs
            scripts/legacy_inventory.cjs
            scripts/build_site.py
            tests/_fixtures.cjs
            tests/data-format.test.cjs
            tests/legacy-inventory.test.cjs
            tests/manage-content.test.cjs
            tests/streams.test.cjs
            tests/schedule-page.test.cjs
            tests/member-icon.test.cjs
            tests/platforms.test.cjs
            tests/v6-features.test.cjs
            tests/v61.test.cjs
          )
          missing=0
          for item in "${required[@]}"; do
            if [[ ! -f "$item" ]]; then
              echo "::error file=$item::Missing $item. Copy the full tests/ directory from the Ver.6.1 release package to the repository root. If a script is missing, obtain it from the Ver.6.1 release package."
              echo "MISSING: $item"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            {
              echo '## Live Craft: 管理・テスト用ファイルが不足しています'
              echo 'エラーで表示されたパスに、Ver.6.1 正式版のファイルをアップロードしてください。'
              echo '保存先はリポジトリ直下の `tests/` と `scripts/` です。'
              echo 'アップロード後、コミットしてから Actions を新規実行してください。'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'PASS: All required Live Craft scripts and tests are present.'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate published data files (read only)
        run: node tests/data-format.test.cjs
      - name: Validate schedule status rules
        run: node tests/streams.test.cjs
      - name: Validate member platform filters
        run: node tests/platforms.test.cjs
      - name: Validate Ver 6.1 features
        run: node tests/v61.test.cjs
      - name: Validate Ver.6.0 features
        run: node tests/v6-features.test.cjs
      - run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build SEO and optimized site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_site.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Failure guidance (see failed step above)
        if: ${{ failure() }}
        run: |
          {
            echo '## Live Craft: 実行に失敗しました'
            echo '赤い × が付いたステップを展開し、exit code 1 より上の最初の ERROR / Error を確認してください。'
            echo '- Update / tests: 入力値、対象ID、日時、データ形式を確認'
            echo '- Commit validated change: Actions の Contents 書込権限、ブランチ保護・ruleset を確認'
            echo '- Build / Upload Pages: Python/Pillow のエラーと Pages 設定を確認'
            echo '詳細: リポジトリの ACTIONS_ERROR_GUIDE.md'
          } >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Failure guidance for deployment
        if: ${{ failure() }}
        run: |
          {
            echo '## GitHub Pages 公開に失敗しました'
            echo '赤い × の Deploy ステップを確認してください。'
            echo 'Settings → Pages → Source = GitHub Actions、environment の承認条件、Pages / id-token 権限を確認してください。'
            echo '詳細: ACTIONS_ERROR_GUIDE.md'
          } >> "$GITHUB_STEP_SUMMARY"
